  const docs=[
    {id:'attention',title:'Understanding Attention',display:'Understanding<br>Attention',sub:'理解注意力机制：从直觉到结构',category:'机器学习',format:'教学示例',extent:'8 段',progress:'34%',term:'Self-attention',cn:'自注意力',section:'The idea behind attention',intro:'When we read a sentence, we rarely give every word equal importance. Attention provides a way to combine information with unequal weights.',source:' refers to an attention operation in which queries, keys, and values are derived from the same input sequence.',next:'Each token produces a query that is compared with the keys of other tokens. The resulting scores are normalized using softmax. The attention weights then determine a weighted combination of the values.',tail:'A query expresses what a token is looking for; a key describes information that a token can offer.',answer:'同一个序列中的词语可以彼此参考，再按权重汇总信息。一个词的表示，因此可以包含其他位置提供的线索。',context:'这里的“self”指 Query、Key 和 Value 来自同一输入序列。它强调序列内部的信息交互，而不是“一个词只关注自己”。',example:'理解“那本书很厚，但它很有趣”中的“它”时，可以参考同一句话中的“书”，将其他位置的信息纳入表示。'},

  function switchFeatured(direction){const index=docs.indexOf(currentDoc());state.document=docs[(index+direction+docs.length)%docs.length].id;deckDirection=direction;const existing=main.querySelector('.cs-feature');if(!existing)return;existing.outerHTML=featured();const feature=main.querySelector('.cs-feature');move(feature.querySelector('.cs-cover'),[{opacity:.3,transform:`translateX(${direction*24}px) rotate(${direction*3}deg) scale(.97)`},{opacity:1,transform:'translateX(0) rotate(0) scale(1)'}],280);move(feature.querySelector('.cs-feature-copy'),[{opacity:.25,transform:`translateX(${direction*8}px)`},{opacity:1,transform:'translateX(0)'}],200);icons();persist();}
  function documentRows(){const list=main.querySelector('.cs-documents');if(!list)return;const previous=new Map([...list.querySelectorAll('[data-open]')].map(el=>[el.dataset.open,el.getBoundingClientRect()]));const visible=docs.filter(d=>(state.category==='全部'||d.category===state.category)&&d.title.toLowerCase().includes(state.query.toLowerCase()));list.innerHTML=visible.map(d=>`<button type="button" class="cs-document cursor-interaction" data-open="${d.id}" aria-label="打开 ${esc(d.title)}"><span class="cs-doc-thumbnail">${coverArt(d,true)}</span><span class="cs-doc-copy"><span class="cs-doc-inline-index">${String(docs.indexOf(d)+1).padStart(2,'0')} / ${d.category}</span><strong>${esc(d.title)}</strong><small>${d.extent}</small></span><span class="cs-doc-format">${d.format}</span><span class="cs-doc-progress">${d.progress}${icon('arrow-up-right')}</span></button>`).join('')||'<p class="cs-empty">没有匹配的示例文档</p>';for(const el of list.querySelectorAll('[data-open]')){const old=previous.get(el.dataset.open),now=el.getBoundingClientRect();if(old){const dy=old.top-now.top;if(Math.abs(dy)>1)move(el,[{transform:`translateY(${dy}px)`},{transform:'translateY(0)'}],180);}else if(previous.size)move(el,[{opacity:.25,transform:'translateY(6px)'},{opacity:1,transform:'translateY(0)'}],180);}icons();updateCategoryMarker();}
  function updateCategoryMarker(){const nav=main.querySelector('.cs-categories');if(!nav)return;let marker=nav.querySelector('.cs-category-marker');if(!marker){marker=document.createElement('span');marker.className='cs-category-marker';marker.setAttribute('aria-hidden','true');nav.append(marker);}const active=nav.querySelector('[aria-pressed="true"]');if(!active)return;const origin=nav.getBoundingClientRect(),target=active.getBoundingClientRect(),old=marker.getBoundingClientRect();activeAnimations.get(marker)?.cancel();marker.style.width=target.width+'px';marker.style.transform=`translateX(${target.left-origin.left}px)`;if(old.width&&allowsMotion())move(marker,[{transform:`translateX(${old.left-origin.left}px) scaleX(${old.width/target.width})`},{transform:`translateX(${target.left-origin.left}px) scaleX(1)`}],180);}
  function library(collection='文档'){
    clearTimeout(turnTimer);state.view='library';root.dataset.view='library';header.innerHTML=originalHeader;
    header.querySelectorAll('[aria-current]').forEach(el=>el.removeAttribute('aria-current'));

    const normal=collection==='文档';
    main.innerHTML=`<header class="cs-library-head"><div><span class="cs-eyebrow">PERSONAL COLLECTION / ${normal?'03 DOCUMENTS':collection==='阅读记录'?'READING HISTORY':'TERMS'}</span><h1>${normal?'文档库':collection}</h1><p>${normal?'从上次停下的地方，继续。':'Understanding Attention · 示例记录'}</p></div>${normal?`<button type="button" class="cs-primary cs-motion cursor-interaction" data-action="import">${icon('plus')}导入文档</button>`:''}</header>${normal?`${featured()}<div class="cs-library-tools"><nav class="cs-categories" aria-label="文档分类">${['全部','机器学习','电机学','研究方法'].map(c=>`<button type="button" class="cursor-interaction" data-category="${c}" aria-pressed="${state.category===c}">${c}</button>`).join('')}</nav><label class="cs-search">${icon('search')}<input type="search" placeholder="搜索文档" aria-label="搜索示例文档" value="${esc(state.query)}"></label></div><div class="cs-list-head" aria-hidden="true"><span>NO.</span><span>DOCUMENT / 文档</span><span>FORMAT</span><span>PROGRESS</span></div><div class="cs-documents"></div>`:`<div class="cs-saved-records"><button type="button" class="cs-saved-row cursor-interaction" data-open="attention"><span>${collection==='术语本'?'Self-attention · 自注意力':'Understanding Attention'}</span><small>继续阅读 ${icon('arrow-up-right')}</small></button></div>`}`;

  function reader(id){
    clearTimeout(turnTimer);state.view='reader';state.document=id;selectionText='';root.dataset.view='reader';const d=currentDoc();
    header.innerHTML=`<button type="button" class="cursor-interaction" data-action="library">${icon('arrow-left')}文档库</button><div class="cs-reader-title"><strong style="view-transition-name:cs-current-document">${esc(d.title)}</strong><span>${d.format} / 阅读示例</span></div><div class="cs-header-actions"><button type="button" class="cs-icon cursor-interaction" data-action="panel" aria-label="展开或收起解读" aria-pressed="${state.assistant}">${icon('panel-right')}</button><button type="button" class="cs-appearance cursor-interaction" data-action="settings" aria-label="打开外观与阅读设置">${icon('sliders-horizontal')}<span class="cs-style-label">${styleNames[state.style]}</span></button></div>`;

r-interaction">举个例子 ${icon('chevron-down')}</summary><p>${d.example}</p></details><div class="cs-new-turns" aria-live="polite"></div></div><form class="cs-compose"><label for="cs-question">追问 ${d.term}</label><div class="cs-question-wrap"><textarea id="cs-question" rows="2" placeholder="还有哪里没理解？" maxlength="600"></textarea><div class="cs-question-bottom"><select aria-label="示例解释深度"><option>通俗解释</option><option>学术解释</option></select><button type="submit" class="cs-primary cs-motion cursor-interaction" aria-label="发送示例问题" disabled>发送 ${icon('arrow-up-right')}</button></div></div></form></aside></div>`;
    const pageLabel=main.querySelector('.cs-page-label');pageLabel.insertAdjacentHTML('beforeend','<span class="cs-reading-edition">READ / '+String(docs.indexOf(d)+1).padStart(2,'0')+'</span>');
    const rail=main.querySelector('.cs-reading-rail');const progress=document.createElement('span');progress.className='cs-linear-progress';progress.setAttribute('aria-hidden','true');progress.innerHTML='<span style="width:'+parseInt(d.progress||'0')+'%"></span>';if(d.progress==='未读')progress.innerHTML='<span style="width:0%"></span>';rail.prepend(progress);

    root.querySelector('.cs-footer-state').textContent='所选内容 → 语境解读';appearance();icons();
  }
  function updateStyleFrame(previous){const options=dialog.querySelector('.cs-style-options');let frame=options.querySelector('.cs-style-active-frame');if(!frame){frame=document.createElement('span');frame.className='cs-style-active-frame';frame.setAttribute('aria-hidden','true');options.append(frame);}const card=options.querySelector('input:checked')?.closest('label');if(!card)return;const origin=options.getBoundingClientRect(),box=card.getBoundingClientRect();const old=previous||frame.getBoundingClientRect();indicatorAnimation?.cancel();frame.style.width=box.width+'px';frame.style.height=box.height+'px';frame.style.transform=`translate(${box.left-origin.left}px,${box.top-origin.top}px)`;if(previous&&old.width&&old.height&&allowsMotion()){indicatorAnimation=frame.animate([{transform:`translate(${old.left-origin.left}px,${old.top-origin.top}px) scale(${old.width/box.width},${old.height/box.height})`},{transform:`translate(${box.left-origin.left}px,${box.top-origin.top}px) scale(1,1)`}],{duration:240,easing:'cubic-bezier(.23,1,.32,1)'});indicatorAnimation.finished.catch(()=>{});}}
  function openSettings(trigger){if(dialog.open)return;saved={style:state.style,motion:state.motion,size:state.size};dialogTrigger=trigger;modalClosing=false;dialog.classList.remove('cs-closing');dialog.showModal();updateStyleFrame();modalAnimation=move(dialog,[{opacity:0,transform:'translateY(14px) scale(.97)'},{opacity:1,transform:'translateY(0) scale(1)'}],260);}
  function closeSettings(save){if(!dialog.open||modalClosing)return;modalClosing=true;const finish=()=>{if(!save&&saved)Object.assign(state,saved);appearance();dialog.close();dialog.classList.remove('cs-closing');modalClosing=false;dialogTrigger?.focus({preventScroll:true});if(save)persist();};if(allowsMotion()){const view=getComputedStyle(dialog),from={opacity:view.opacity,transform:view.transform==='none'?'translateY(0) scale(1)':view.transform};modalAnimation?.cancel();dialog.classList.add('cs-closing');modalAnimation=move(dialog,[from,{opacity:0,transform:'translateY(10px) scale(.98)'}],160);modalAnimation.finished.then(finish).catch(()=>{modalClosing=false;});}else finish();}
  function panel(){const layout=main.querySelector('.cs-reader-layout');if(!layout)return;state.assistant=!state.assistant;changeView(()=>{layout.classList.toggle('cs-focused',!state.assistant);main.querySelector('.cs-assistant').hidden=!state.assistant;header.querySelector('[data-action="panel"]').setAttribute('aria-pressed',String(state.assistant));});persist();}
  function questionFlight(form,section,question){if(!allowsMotion())return;const origin=root.getBoundingClientRect(),start=form.querySelector('.cs-question-wrap').getBoundingClientRect(),end=section.getBoundingClientRect();const card=document.createElement('div');card.className='cs-flight-layer cs-question-flight';card.setAttribute('aria-hidden','true');card.inert=true;card.textContent=question;Object.assign(card.style,{left:start.left-origin.left+'px',top:start.top-origin.top+'px',width:start.width+'px',height:start.height+'px'});root.append(card);const animation=card.animate([{transform:'translate(0,0) scale(1,1)',opacity:1,offset:0},{transform:`translate(${(end.left-start.left)*.9}px,${(end.top-start.top)*.9}px) scale(${1+(end.width/start.width-1)*.9},${1+(end.height/start.height-1)*.9})`,opacity:.9,offset:.6},{transform:`translate(${end.left-start.left}px,${end.top-start.top}px) scale(${end.width/start.width},${end.height/start.height})`,opacity:0,offset:1}],{duration:260,easing:'cubic-bezier(.23,1,.32,1)'});animation.finished.catch(()=>{}).finally(()=>card.remove());section.animate([{opacity:0,offset:0},{opacity:0,offset:.15},{opacity:1,offset:1}],{duration:260,easing:'cubic-bezier(.23,1,.32,1)'});}
  function submitQuestion(form){
    const field=form.querySelector('textarea'),button=form.querySelector('[data-action="submit-question"]');
    if(turnTimer){clearTimeout(turnTimer);turnTimer=null;const last=main.querySelector('.cs-turn:last-child p');if(last)last.textContent='已停止生成示例。';button.innerHTML='发送 '+icon('arrow-up-right');delete button.dataset.generating;button.disabled=!field.value.trim();button.setAttribute('aria-label','发送示例问题');icons();return;}
    const question=field.value.trim();if(!question)return;const d=currentDoc();const section=document.createElement('section');section.className='cs-turn';const h=document.createElement('strong'),p=document.createElement('p');h.textContent=question;p.textContent='正在组织示例解读…';section.append(h,p);main.querySelector('.cs-new-turns').append(section);button.innerHTML=icon('square')+'停止';button.dataset.generating='true';button.setAttribute('aria-label','停止示例生成');icons();

    move(button,[{transform:'scale(.94)'},{transform:'scale(1)'}],160);

  }
  root.addEventListener('pointerdown',()=>root.dataset.input='pointer',{passive:true});
  root.addEventListener('keydown',()=>root.dataset.input='keyboard',true);
  root.addEventListener('click',e=>{
    const button=e.target.closest('button');if(!button)return;
    if(button.dataset.open){const id=button.dataset.open;const activeCover=main.querySelector('.cs-cover');if(activeCover)activeCover.style.viewTransitionName='';const source=button.classList.contains('cs-feature-open')?activeCover:button;if(source)source.style.viewTransitionName='cs-document-sheet';if(button.classList.contains('cs-document')){main.querySelector('.cs-feature-copy h2')?.style.removeProperty('view-transition-name');button.querySelector('.cs-doc-copy strong').style.viewTransitionName='cs-current-document';}changeView(()=>{reader(id);persist();});return;}
    if(button.dataset.category){state.category=button.dataset.category;main.querySelectorAll('[data-category]').forEach(el=>el.setAttribute('aria-pressed',String(el===button)));documentRows();return;}
    if(button.dataset.mode){state.mode=button.dataset.mode;main.querySelectorAll('[data-mode]').forEach(el=>el.setAttribute('aria-pressed',String(el===button)));return;}
    const action=button.dataset.action;
    if(action==='library'){changeView(()=>{library();persist();});}
    else if(action==='records'||action==='terms'){changeView(()=>{library(action==='records'?'阅读记录':'术语本');persist();});}
    else if(action==='settings')openSettings(button);
    else if(action==='previous-document')switchFeatured(-1);
    else if(action==='next-document')switchFeatured(1);
    else if(action==='cancel-settings')closeSettings(false);
    else if(action==='save-settings')closeSettings(true);
    else if(action==='panel')panel();
    else if(action==='submit-question')submitQuestion(button.closest('form'));
    else if(action==='term'){if(!state.assistant)panel();const answer=main.querySelector('.cs-answer');if(allowsMotion())answer.animate([{opacity:.65},{opacity:1}],{duration:150});feedback('已展开 '+currentDoc().term+' 的语境解读示例');}
    else if(action==='source'){const p=main.querySelector('.cs-source-paragraph');p?.classList.add('cs-source-flash');p?.querySelector('button')?.focus({preventScroll:true});setTimeout(()=>p?.classList.remove('cs-source-flash'),1100);}
    else if(action==='bookmark'){const on=button.getAttribute('aria-pressed')!=='true';button.setAttribute('aria-pressed',String(on));feedback(on?'已收藏这条示例解读':'已取消收藏');}
    else if(action==='history')feedback('示例记录：'+currentDoc().term+' · '+currentDoc().cn);
    else if(action==='import')feedback('导入入口预览：PDF、Word、PPT 与文本。此预案使用示例文档。');
  });
  root.addEventListener('input',e=>{if(e.target.matches('.cs-search input')){state.query=e.target.value;documentRows();}if(e.target.matches('#cs-question'))e.target.closest('form').querySelector('[data-action="submit-question"]').disabled=!turnTimer&&!e.target.value.trim();});
  root.addEventListener('change',e=>{if(e.target.name==='clever-style'){const previous=dialog.querySelector('.cs-style-active-frame')?.getBoundingClientRect();state.style=e.target.value;appearance();updateStyleFrame(previous);}else if(e.target.id==='cs-motion'){state.motion=e.target.checked;appearance();}else if(e.target.id==='cs-paper-size'){state.size=Number(e.target.value);appearance();}});
  root.addEventListener('submit',e=>{if(e.target.matches('.cs-compose')){e.preventDefault();submitQuestion(e.target);}});
  root.addEventListener('keydown',e=>{if(e.target.id==='cs-question'&&e.key==='Enter'&&!e.shiftKey&&!e.isComposing){e.preventDefault();submitQuestion(e.target.closest('form'));}});
  dialog.addEventListener('cancel',e=>{e.preventDefault();closeSettings(false);});
  main.addEventListener('mouseup',e=>{if(state.view!=='reader'||!e.target.closest('.cs-paper')||e.target.closest('button'))return;const selection=window.getSelection();const value=selection?.toString().trim();if(!value||value.length>600||!main.querySelector('.cs-paper').contains(selection.anchorNode)||!main.querySelector('.cs-paper').contains(selection.focusNode))return;selectionText=value;if(!state.assistant)panel();const label=main.querySelector('.cs-compose label');label.textContent='追问选区：'+value.slice(0,48)+(value.length>48?'…':'');feedback('已选中原文，可在解读区继续提问。');});
  function restore(incoming){if(!incoming||dialog.open)return;const nextView=incoming.view==='reader'?'reader':'library';const nextDocument=docs.some(d=>d.id===incoming.document)?incoming.document:state.document;const redraw=!main.firstElementChild||state.view!==nextView||(nextView==='reader'&&state.document!==nextDocument);if(styleNames[incoming.style])state.style=incoming.style;if(typeof incoming.motion==='boolean')state.motion=incoming.motion;if([16,18,20].includes(incoming.size))state.size=incoming.size;state.document=nextDocument;if(typeof incoming.assistant==='boolean')state.assistant=incoming.assistant;if(redraw){if(nextView==='reader')reader(state.document);else library();}else if(nextView==='reader'){main.querySelector('.cs-reader-layout').classList.toggle('cs-focused',!state.assistant);main.querySelector('.cs-assistant').hidden=!state.assistant;header.querySelector('[data-action="panel"]').setAttribute('aria-pressed',String(state.assistant));}appearance();}
  const restored=window.openai?.widgetState?.privateContent;if(restored)restore(restored);else library();
  window.addEventListener('openai:set_globals',e=>{const incoming=e.detail?.globals?.widgetState?.privateContent;if(incoming)restore(incoming);});
  if(globalThis.Tweak){const t=new Tweak({container:root,onChange:()=>{root.querySelectorAll('.cs-feature,.cs-library-tools,.cs-document').forEach(el=>el.style.borderColor=tuning.edge==='soft'?'var(--cs-line)':'');}});t.addSelect(tuning,'edge',{label:'分隔线对比',options:[{label:'清晰',value:'clear'},{label:'柔和',value:'soft'}]});}
  new ResizeObserver(()=>{if(dialog.open&&!modalClosing)updateStyleFrame();}).observe(dialog.querySelector('.cs-style-options'));
  icons();requestAnimationFrame(icons);window.addEventListener('load',icons,{once:true});
})();
</script>
