  function reader(id){
    clearTimeout(turnTimer);state.view='reader';state.document=id;selectionText='';root.dataset.view='reader';const d=currentDoc();
    header.innerHTML=`<button type="button" class="cursor-interaction" data-action="library">${icon('arrow-left')}文档库</button><div class="cs-reader-title"><strong style="view-transition-name:cs-current-document">${esc(d.title)}</strong><span>${d.format} / 阅读示例</span></div><div class="cs-header-actions"><button type="button" class="cs-icon cursor-interaction" data-action="panel" aria-label="展开或收起解读" aria-pressed="${state.assistant}">${icon('panel-right')}</button><button type="button" class="cs-appearance cursor-interaction" data-action="settings" aria-label="打开外观与阅读设置">${icon('sliders-horizontal')}<span class="cs-style-label">${styleNames[state.style]}</span></button></div>`;
    main.innerHTML=`<div class="cs-reader-layout ${state.assistant?'':'cs-focused'}"><section class="cs-reading-area" aria-label="文档阅读区"><div class="cs-page-label"><span>01 / 03</span><span>流式阅读 · 教学示例</span></div><article class="cs-paper" style="view-transition-name:cs-document-sheet"><div class="cs-paper-kicker"><span>CLEVER READ / READING EXAMPLE</span><span>01</span></div><h1>${d.display}</h1><p class="cs-paper-sub">${d.sub}</p><h2>01 &nbsp; ${d.section}</h2><p>${d.intro}</p><p class="cs-source-paragraph"><button type="button" class="cs-term cursor-interaction" data-action="term">${d.term}</button>${d.source}</p><p>${d.next}</p><h2>02 &nbsp; ${d.id==='attention'?'From similarity to a representation':'进一步理解'}</h2><p>${d.tail}</p></article><div class="cs-reading-rail"><div class="cs-reading-modes" aria-label="原文选择方式"><button type="button" class="cursor-interaction" data-mode="选词" aria-pressed="${state.mode==='选词'}">选词</button><button type="button" class="cursor-interaction" data-mode="选句" aria-pressed="${state.mode==='选句'}">选句</button></div><span class="cs-rail-progress">阅读进度 ${d.progress==='未读'?'0%':d.progress}</span></div></section><aside class="cs-assistant" aria-label="原文解读" ${state.assistant?'':'hidden'}><header class="cs-assistant-head"><strong>解读</strong><div><button type="button" class="cs-icon cursor-interaction" data-action="history" aria-label="查看示例问答记录">${icon('history')}</button><button type="button" class="cs-icon cursor-interaction" data-action="bookmark" aria-label="收藏示例解读" aria-pressed="false">${icon('bookmark')}</button></div></header><div class="cs-answer"><div class="cs-answer-kicker">CONTEXT / 语境解读 · 示例</div><h2>${d.term}</h2><p class="cs-term-cn">${d.cn}</p><p class="cs-answer-body">${d.answer}</p><section class="cs-context"><h3>结合这段原文</h3><p>${d.context}</p><button type="button" class="cs-source-button cursor-interaction" data-action="source">返回所选原文 ${icon('arrow-up-right')}</button></section><details class="cs-example"><summary class="cursor-interaction">举个例子 ${icon('chevron-down')}</summary><p>${d.example}</p></details><div class="cs-new-turns" aria-live="polite"></div></div><form class="cs-compose"><label for="cs-question">追问 ${d.term}</label><div class="cs-question-wrap"><textarea id="cs-question" rows="2" placeholder="还有哪里没理解？" maxlength="600"></textarea><div class="cs-question-bottom"><select aria-label="示例解释深度"><option>通俗解释</option><option>学术解释</option></select><button type="submit" class="cs-primary cs-motion cursor-interaction" aria-label="发送示例问题" disabled>发送 ${icon('arrow-up-right')}</button></div></div></form></aside></div>`;
    root.querySelector('.cs-footer-state').textContent='所选内容 → 语境解读';appearance();icons();
  }
  function openSettings(trigger){if(dialog.open)return;saved={style:state.style,motion:state.motion,size:state.size};dialogTrigger=trigger;dialog.showModal();if(allowsMotion())dialog.animate([{opacity:0,transform:'translateY(8px) scale(.98)'},{opacity:1,transform:'translateY(0) scale(1)'}],{duration:240,easing:'cubic-bezier(.23,1,.32,1)'});}
  function closeSettings(save){if(!dialog.open)return;if(!save&&saved)Object.assign(state,saved);appearance();dialog.close();dialogTrigger?.focus({preventScroll:true});if(save)persist();}
  function panel(){const layout=main.querySelector('.cs-reader-layout');if(!layout)return;state.assistant=!state.assistant;changeView(()=>{layout.classList.toggle('cs-focused',!state.assistant);main.querySelector('.cs-assistant').hidden=!state.assistant;header.querySelector('[data-action="panel"]').setAttribute('aria-pressed',String(state.assistant));});persist();}
  function submitQuestion(form){
    const field=form.querySelector('textarea'),button=form.querySelector('[type="submit"]');
    if(turnTimer){clearTimeout(turnTimer);turnTimer=null;const last=main.querySelector('.cs-turn:last-child p');if(last)last.textContent='已停止生成示例。';button.textContent='发送';button.disabled=!field.value.trim();button.setAttribute('aria-label','发送示例问题');return;}
    const question=field.value.trim();if(!question)return;const d=currentDoc();const section=document.createElement('section');section.className='cs-turn';const h=document.createElement('strong'),p=document.createElement('p');h.textContent=question;p.textContent='正在组织示例解读…';section.append(h,p);main.querySelector('.cs-new-turns').append(section);button.textContent='停止';button.setAttribute('aria-label','停止示例生成');
    if(allowsMotion())section.animate([{opacity:0,transform:'translateY(5px)'},{opacity:1,transform:'translateY(0)'}],{duration:180,easing:'cubic-bezier(.23,1,.32,1)'});
    turnTimer=setTimeout(()=>{p.textContent='示例回答：'+d.example+' '+d.context;field.value='';button.textContent='发送';button.disabled=true;button.setAttribute('aria-label','发送示例问题');turnTimer=null;},850);
  }
  root.addEventListener('pointerdown',()=>root.dataset.input='pointer',{passive:true});
  root.addEventListener('keydown',()=>root.dataset.input='keyboard',true);
  root.addEventListener('click',e=>{
    const button=e.target.closest('button');if(!button)return;
    if(button.dataset.open){changeView(()=>reader(button.dataset.open));persist();return;}
    if(button.dataset.category){state.category=button.dataset.category;main.querySelectorAll('[data-category]').forEach(el=>el.setAttribute('aria-pressed',String(el===button)));documentRows();return;}
    if(button.dataset.mode){state.mode=button.dataset.mode;main.querySelectorAll('[data-mode]').forEach(el=>el.setAttribute('aria-pressed',String(el===button)));return;}
    const action=button.dataset.action;
    if(action==='library'){changeView(()=>library());persist();}
    else if(action==='records'||action==='terms'){changeView(()=>library(action==='records'?'阅读记录':'术语本'));persist();}
    else if(action==='settings')openSettings(button);
    else if(action==='cancel-settings')closeSettings(false);
    else if(action==='save-settings')closeSettings(true);
    else if(action==='panel')panel();
    else if(action==='term'){if(!state.assistant)panel();const answer=main.querySelector('.cs-answer');if(allowsMotion())answer.animate([{opacity:.65},{opacity:1}],{duration:150});feedback('已展开 '+currentDoc().term+' 的语境解读示例');}
    else if(action==='source'){const p=main.querySelector('.cs-source-paragraph');p?.classList.add('cs-source-flash');p?.querySelector('button')?.focus({preventScroll:true});setTimeout(()=>p?.classList.remove('cs-source-flash'),1100);}
    else if(action==='bookmark'){const on=button.getAttribute('aria-pressed')!=='true';button.setAttribute('aria-pressed',String(on));feedback(on?'已收藏这条示例解读':'已取消收藏');}
    else if(action==='history')feedback('示例记录：'+currentDoc().term+' · '+currentDoc().cn);
    else if(action==='import')feedback('导入入口预览：PDF、Word、PPT 与文本。此预案使用示例文档。');
  });
  root.addEventListener('input',e=>{if(e.target.matches('.cs-search input')){state.query=e.target.value;documentRows();}if(e.target.matches('#cs-question'))e.target.closest('form').querySelector('[type="submit"]').disabled=!turnTimer&&!e.target.value.trim();});
  root.addEventListener('change',e=>{if(e.target.name==='clever-style'){state.style=e.target.value;appearance();}else if(e.target.id==='cs-motion'){state.motion=e.target.checked;appearance();}else if(e.target.id==='cs-paper-size'){state.size=Number(e.target.value);appearance();}});
  root.addEventListener('submit',e=>{if(e.target.matches('.cs-compose')){e.preventDefault();submitQuestion(e.target);}});
  root.addEventListener('keydown',e=>{if(e.target.id==='cs-question'&&e.key==='Enter'&&!e.shiftKey&&!e.isComposing){e.preventDefault();submitQuestion(e.target.closest('form'));}});
  dialog.addEventListener('cancel',e=>{e.preventDefault();closeSettings(false);});
  main.addEventListener('mouseup',e=>{if(state.view!=='reader'||!e.target.closest('.cs-paper')||e.target.closest('button'))return;const selection=window.getSelection();const value=selection?.toString().trim();if(!value||value.length>600||!main.querySelector('.cs-paper').contains(selection.anchorNode)||!main.querySelector('.cs-paper').contains(selection.focusNode))return;selectionText=value;if(!state.assistant)panel();const label=main.querySelector('.cs-compose label');label.textContent='追问选区：'+value.slice(0,48)+(value.length>48?'…':'');feedback('已选中原文，可在解读区继续提问。');});
  function restore(incoming){if(!incoming)return;if(styleNames[incoming.style])state.style=incoming.style;if(typeof incoming.motion==='boolean')state.motion=incoming.motion;if([16,18,20].includes(incoming.size))state.size=incoming.size;if(docs.some(d=>d.id===incoming.document))state.document=incoming.document;if(typeof incoming.assistant==='boolean')state.assistant=incoming.assistant;if(incoming.view==='reader')reader(state.document);else library();appearance();}
  const restored=window.openai?.widgetState?.privateContent;if(restored)restore(restored);else library();
  window.addEventListener('openai:set_globals',e=>{const incoming=e.detail?.globals?.widgetState?.privateContent;if(incoming)restore(incoming);});
  if(globalThis.Tweak){const t=new Tweak({container:root,onChange:()=>{root.querySelectorAll('.cs-feature,.cs-library-tools,.cs-document').forEach(el=>el.style.borderColor=tuning.edge==='soft'?'var(--cs-line)':'');}});t.addSelect(tuning,'edge',{label:'分隔线对比',options:[{label:'清晰',value:'clear'},{label:'柔和',value:'soft'}]});}
  icons();requestAnimationFrame(icons);window.addEventListener('load',icons,{once:true});
})();
</script>
